name: Set up Node.js and pnpm
description: >
  Installs pnpm (the version pinned in package.json "packageManager"), Node.js 22 with the
  pnpm store cached, and the workspace dependencies exactly as locked in pnpm-lock.yaml.
  Run actions/checkout first.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
